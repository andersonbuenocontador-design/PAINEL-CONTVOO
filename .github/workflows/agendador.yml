# Uma vez por dia: confere a saúde do site. O acesso também mantém o projeto do Supabase ativo
# (o plano grátis pausa projetos sem uso por 7 dias). Avisos por e-mail estão desligados (o escritório optou por não usar e-mail).
name: Manter site ativo
on:
  schedule:
    - cron: '7 11 * * *'
  workflow_dispatch:
concurrency: { group: agendador, cancel-in-progress: false }
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferir o site
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL || 'https://painel-contvoo.onrender.com' }}
        run: |
          # mensagens ::notice::/::error:: aparecem no resumo da execução (sem mostrar valores secretos)
          base="${APP_URL%/}"
          # o Render grátis "dorme": a 1ª chamada pode levar ~1 minuto para acordar o site
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o saude.json -w '%{http_code}' --max-time 120 "$base/api/saude" || echo 000)
            [ "$code" = 200 ] || [ "$code" = 503 ] && break
            echo "tentativa $i: HTTP $code"; sleep 30
          done
          if [ "$code" = 200 ]; then echo "::notice::Site OK: $(cat saude.json)"
          elif [ "$code" = 503 ]; then echo "::error::Site no ar, mas com problema de configuração: $(cat saude.json)"; exit 1
          else echo "::error::O site não respondeu em $base (HTTP $code). No Render, o serviço painel-contvoo está Live?"; exit 1; fi
