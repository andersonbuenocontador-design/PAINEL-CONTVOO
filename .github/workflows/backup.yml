# Todo dia às 03:15 (Brasília): backup cifrado do banco e dos documentos + teste de restauração num banco descartável.
# O backup fica guardado como "artifact" desta execução por 7 dias (Actions → Backup diário → execução → Artifacts).
# Se falhar, o GitHub manda e-mail ao dono do repositório.
# Segredos: DATABASE_URL, SUPABASE_URL, SUPABASE_SECRET_KEY, BACKUP_PASSPHRASE.
name: Backup diário
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
concurrency: { group: backup, cancel-in-progress: false }
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      teste:
        image: postgres:17
        env: { POSTGRES_PASSWORD: teste, POSTGRES_DB: teste }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_DIR: ${{ github.workspace }}/backup-saida
      TESTE_DB_URL: postgres://postgres:teste@localhost:5432/teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Backup
        run: bash scripts/backup-nuvem.sh
      - name: Testar restauração
        run: bash scripts/testar-backup-nuvem.sh "$BACKUP_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: backup-painel-${{ github.run_number }}
          path: backup-saida/
          retention-days: 7
          if-no-files-found: error
