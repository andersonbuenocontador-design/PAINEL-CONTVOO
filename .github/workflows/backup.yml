# Todo dia às 03:15 (Brasília): backup cifrado do banco e dos documentos + teste de restauração num banco descartável.
# O backup fica guardado como "artifact" desta execução por 7 dias (Actions → Backup diário → execução → Artifacts).
# Se falhar, o GitHub manda e-mail ao dono do repositório.
# Segredos: DATABASE_URL, SUPABASE_URL, SUPABASE_SECRET_KEY, BACKUP_PASSPHRASE.
name: Backup diário
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
concurrency: { group: backup, cancel-in-progress: false }
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      teste:
        image: postgres:17
        env: { POSTGRES_PASSWORD: teste, POSTGRES_DB: teste }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_DIR: ${{ github.workspace }}/backup-saida
      TESTE_DB_URL: postgres://postgres:teste@localhost:5432/teste
    steps:
      - name: Conferir configuração
        run: |
          falta=""; for v in DATABASE_URL SUPABASE_URL SUPABASE_SECRET_KEY BACKUP_PASSPHRASE; do [ -n "${!v}" ] || falta="$falta $v"; done
          [ -z "$falta" ] || { echo "::error::Faltam segredos (Settings → Secrets and variables → Actions → aba Secrets, nome exatamente igual):$falta"; exit 1; }
          [ ${#BACKUP_PASSPHRASE} -ge 16 ] || { echo "::error::BACKUP_PASSPHRASE tem ${#BACKUP_PASSPHRASE} caracteres; precisa de 16 ou mais"; exit 1; }
          case "$DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "::error::DATABASE_URL deve começar com postgresql://"; exit 1;; esac
          case "$DATABASE_URL" in *YOUR-PASSWORD*) echo "::error::DATABASE_URL ainda tem [YOUR-PASSWORD]: troque pela senha do banco"; exit 1;; esac
          case "$SUPABASE_URL" in https://*.supabase.co|https://*.supabase.co/) ;; *) echo "::error::SUPABASE_URL deve ser como https://xxxx.supabase.co"; exit 1;; esac
          echo "configuração ok"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Backup
        run: |
          set -o pipefail
          bash scripts/backup-nuvem.sh 2>&1 | tee saida.log || { echo "::error::Backup falhou: $(tail -n 4 saida.log | tr '\n' ' ' | cut -c1-600)"; exit 1; }
      - name: Testar restauração
        run: |
          set -o pipefail
          bash scripts/testar-backup-nuvem.sh "$BACKUP_DIR" 2>&1 | tee saida.log || { echo "::error::Teste de restauração falhou: $(tail -n 4 saida.log | tr '\n' ' ' | cut -c1-600)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: backup-painel-${{ github.run_number }}
          path: backup-saida/
          retention-days: 7
          if-no-files-found: error
